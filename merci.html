<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #a18cd1, #fbc2eb, #fad0c4, #ffd1ff);
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
    font-family: Georgia, serif;
    padding: 40px 20px;
    text-align: center;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .letter {
    max-width: 600px;
    color: white;
    font-size: 1.3rem;
    line-height: 1.9;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .letter span {
    opacity: 0;
    animation: fadeIn 1s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  a.back {
    margin-top: 40px;
    text-decoration: none;
    background: white;
    color: #a18cd1;
    padding: 12px 26px;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

  <div class="letter" id="letter"></div>
  <a class="back" href="index.html">← Retour</a>

<script>
  const text = `Mon Simon d'amour,

Merci de m'avoir fait découvrir ce monde qui me passionne autant aujourd'hui. Cette page, c'est ma toute première, et elle te revient entièrement.

Merci d'être toujours là, merci pour ta patience, et merci d'être toi tout simplement.

Je t'aime. 💛`;

  const container = document.getElementById('letter');
  let delay = 0;

  text.split('\n').forEach(line => {
    const p = document.createElement('p');
    p.style.marginBottom = '20px';
    const span = document.createElement('span');
    span.textContent = line;
    span.style.animationDelay = delay + 's';
    p.appendChild(span);
    container.appendChild(p);
    delay += 0.8;
  });
</script>

</body>
</html>
