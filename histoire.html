<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre histoire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #ffecd2, #fcb69f, #ff9a9e, #fad0c4);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    font-family: Georgia, serif;
    padding: 40px 20px;
    text-align: center;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 { color: white; font-size: 2.2rem; margin-bottom: 30px; text-shadow: 0 4px 15px rgba(0,0,0,0.25); }
  p {
    max-width: 600px;
    color: white;
    font-size: 1.2rem;
    line-height: 1.8;
    margin-bottom: 30px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  a.back {
    text-decoration: none;
    background: white;
    color: #ff6b6b;
    padding: 12px 26px;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

  <h1>Notre histoire 💫</h1>
  <p>
    Qui aurait cru que je ferai du code pour créer une page web à 1h du matin haha
  </p>

  <a class="back" href="index.html">← Retour</a>

</body>
</html>
